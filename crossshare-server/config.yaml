server:
  port: 10431
  tls_enable: false
  crt_path: ""
  key_path: ""
  data_dir: "./data"
  master_key: ""
  reset_admin: false

cors:
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Content-Type"
    - "Authorization"
    - "X-Request-Id"
    - "Filename"
    - "X-Content-Type"
    - "X-TTL"
    - "Accept"
    - "Delete-After-Pull"

storage:
  type: memory # redis | memory

redis:
  addr: "localhost:6379"
  username: ""
  password: ""
  db: 0
