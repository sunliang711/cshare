<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#eef2fb" id="metaThemeColor" />
		<title>CrossShare</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
		<link rel="stylesheet" href="style.css?v=20260801" />
	</head>
	<body>
		<div class="aurora" aria-hidden="true">
			<span class="blob blob-a"></span>
			<span class="blob blob-b"></span>
			<span class="blob blob-c"></span>
		</div>

		<div class="app-shell">
			<header class="app-header">
				<a class="brand" href="/" aria-label="CrossShare">
					<img src="/favicon.svg?v=2" alt="" />
					<div>
						<h1>CrossShare</h1>
						<p class="subtitle" data-i18n="subtitle">
							跨设备内容分享
						</p>
					</div>
				</a>
				<div class="header-actions">
					<button
						class="icon-btn"
						id="themeToggle"
						data-i18n-title="toggleTheme"
						title="切换主题"
					>
						☾
					</button>
					<button
						class="icon-btn"
						id="langToggle"
						title="Switch to English"
					>
						EN
					</button>
					<button
						class="icon-btn"
						id="settingsToggle"
						data-i18n-title="settings"
						title="设置"
					>
						⚙
					</button>
				</div>
			</header>

			<div id="settingsPanel" class="settings hidden">
				<label>
					<span data-i18n="serverUrlLabel">Server URL</span>
					<input
						type="text"
						id="serverUrl"
						placeholder="http://localhost:10431"
					/>
				</label>
				<label>
					<span data-i18n="tokenLabel">Token (可选)</span>
					<input
						type="password"
						id="authToken"
						placeholder="JWT token"
					/>
				</label>
				<div class="settings-actions">
					<button
						class="btn btn-sm"
						id="saveSettings"
						data-i18n="save"
					>
						保存
					</button>
					<button
						class="btn btn-sm btn-ghost"
						id="healthCheck"
						data-i18n="checkConn"
					>
						检查连接
					</button>
					<span id="healthStatus"></span>
				</div>
			</div>

			<main class="stage">
				<nav class="tabs">
					<button class="tab active" data-tab="push" data-i18n="push">
						发送
					</button>
					<button class="tab" data-tab="pull" data-i18n="pull">
						接收
					</button>
				</nav>

				<section id="pushTab" class="tab-content active">
					<div class="glass-card send-card">
						<button
							type="button"
							id="sendCardToggle"
							class="send-card-strip"
							data-i18n-title="expandSendPanel"
							data-i18n-aria-label="expandSendPanel"
							title="展开发送信息"
							aria-label="展开发送信息"
							aria-expanded="true"
						>
							<span class="send-card-strip-icon" aria-hidden="true"></span>
							<span class="send-card-strip-text">
								<span data-i18n="sendPanelCollapsedTitle">发送信息已收起</span>
							</span>
						</button>

						<div class="mode-switch">
							<button
								class="mode active"
								data-mode="text"
								data-i18n="text"
							>
								文本
							</button>
							<button class="mode" data-mode="file" data-i18n="file">
								文件
							</button>
						</div>

						<div id="textMode">
							<label class="sr-only" for="pushText" data-i18n="textContent">
								文本内容
							</label>
							<div class="text-editor">
								<textarea
									id="pushText"
									data-i18n-placeholder="pushPlaceholder"
									placeholder="输入要分享的文本内容…"
									rows="7"
								></textarea>
								<span class="char-count" id="charCount" aria-hidden="true"></span>
							</div>
						</div>

						<div id="fileMode" class="hidden">
							<div class="drop-zone" id="dropZone">
								<button
									type="button"
									id="clearFile"
									class="file-clear hidden"
									data-i18n-title="clear"
									data-i18n-aria-label="clear"
									title="清除"
									aria-label="清除"
								>
									<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
										<path d="M6 6l12 12" />
										<path d="M18 6L6 18" />
									</svg>
								</button>
								<span class="drop-icon" aria-hidden="true">
									<svg
										class="drop-icon-upload"
										viewBox="0 0 24 24"
										fill="none"
									>
										<path d="M12 16V5" />
										<path d="M8 9l4-4 4 4" />
										<path d="M5 16v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" />
									</svg>
									<svg
										class="drop-icon-ready"
										viewBox="0 0 24 24"
										fill="none"
									>
										<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
										<path d="M14 3v5h5" />
										<path d="M9 14l2 2 4-4" />
									</svg>
								</span>
								<p id="dropTitle" data-i18n="dropHint">拖拽文件到这里</p>
								<span
									id="dropSubtitle"
									class="drop-subtitle"
									data-i18n="dropSubHint"
								>
									或点击选择文件
								</span>
								<ul
									id="selectedFileList"
									class="selected-file-list hidden"
									data-i18n-aria-label="selectedFiles"
									aria-label="已选文件"
									aria-live="polite"
								></ul>
								<input type="file" id="fileInput" multiple />
							</div>
						</div>

						<div class="options-bar">
							<label
								class="direct-toggle"
								data-i18n-title="directTransferHint"
								title="关闭后使用服务器暂存"
							>
								<input
									type="checkbox"
									id="directTransferToggle"
									checked
									data-i18n-aria-label="smartTransfer"
									aria-label="直连优先"
								/>
								<span class="toggle-track" aria-hidden="true">
									<span class="toggle-thumb"></span>
								</span>
								<span class="direct-toggle-text">
									<strong class="direct-toggle-title">直连优先</strong>
									<small
										class="direct-toggle-desc"
										data-i18n="smartTransferDesc"
									>
										优先使用设备直连，速度更快
									</small>
								</span>
							</label>

							<details class="push-more">
								<summary data-i18n="moreSettings">更多设置</summary>
								<div class="options-row">
									<label class="inline">
										<span>TTL</span>
										<input
											type="number"
											id="pushTtl"
											data-i18n-placeholder="defaultPlaceholder"
											placeholder="默认"
											min="1"
										/>
										<span class="unit" data-i18n="seconds">秒</span>
									</label>
								</div>
							</details>
						</div>

						<button
							class="btn btn-hero"
							id="pushBtn"
							data-i18n="push"
							data-i18n-title="push"
							title="发送"
						>
							发送
						</button>
					</div>

					<div id="pushResult" class="glass-card result hidden">
						<div class="result-key">
							<span id="resultKey"></span>
							<div class="result-key-actions">
								<button
									class="btn btn-sm"
									id="copyKey"
									data-i18n="copy"
								>
									复制
								</button>
								<button
									class="btn btn-sm"
									id="copyLink"
									data-i18n="copyLink"
								>
									复制链接
								</button>
								<button
									class="btn btn-sm"
									id="showQr"
									data-i18n="showQr"
								>
									查看二维码
								</button>
								<button
									class="btn btn-sm btn-ghost hidden"
									id="cleanupServerPush"
									data-i18n="cleanup"
								>
									清除结果
								</button>
								<button
									class="btn btn-sm hidden"
									id="saveToServer"
									data-i18n="saveToServer"
								>
									存到服务器
								</button>
								<button
									class="btn btn-sm btn-ghost hidden"
									id="cancelP2p"
									data-i18n="cancel"
								>
									取消
								</button>
							</div>
						</div>
						<div class="result-meta" id="resultMeta"></div>
					</div>
				</section>

				<section id="pullTab" class="tab-content">
					<div class="glass-card receive-card">
						<div class="pull-control">
							<label class="field-label" for="pullKey" data-i18n="enterKey">
								输入 Key
							</label>
							<div class="pull-input">
								<input
									type="text"
									id="pullKey"
									data-i18n-placeholder="enterKey"
									placeholder="输入 Key"
								/>
								<button
									class="btn btn-primary"
									id="pullBtn"
									data-i18n="pull"
									data-i18n-title="pull"
									title="接收"
								>
									接收
								</button>
							</div>
							<label class="checkbox receive-option">
								<input type="checkbox" id="deleteAfterPull" />
								<span>
									<strong data-i18n="deleteAfterPull">一次性拉取</strong>
									<small data-i18n="deleteAfterPullHint">
										拉取成功后删除服务端内容
									</small>
								</span>
							</label>
						</div>

						<details class="pull-more">
							<summary data-i18n="moreActions">更多操作</summary>
							<div class="pull-actions">
								<button
									class="btn btn-ghost"
									id="clearPull"
									data-i18n="clear"
								>
									清除
								</button>
							</div>

							<div class="delete-section">
								<div class="pull-input">
									<input
										type="text"
										id="deleteKey"
										data-i18n-placeholder="enterKey"
										placeholder="输入 Key"
									/>
									<button
										class="btn btn-danger"
										id="deleteBtn"
										data-i18n="delete"
									>
										删除
									</button>
								</div>
								<div id="deleteResult" class="result hidden">
									<div class="result-meta" id="deleteMeta"></div>
								</div>
							</div>
						</details>
					</div>

					<div id="pullResult" class="glass-card result hidden">
						<div id="pullTextResult" class="hidden">
							<div class="pull-text-header">
								<span class="pull-label" data-i18n="textContent"
									>文本内容</span
								>
								<button
									class="btn btn-sm"
									id="copyText"
									data-i18n="copy"
								>
									复制
								</button>
							</div>
							<pre id="pullTextContent"></pre>
						</div>
						<div id="pullFileResult" class="hidden">
							<div class="file-download">
								<span id="pullFileName"></span>
								<a
									id="pullFileLink"
									class="btn btn-sm"
									data-i18n="download"
									>下载</a
								>
							</div>
						</div>
						<div class="result-meta" id="pullMeta"></div>
					</div>
				</section>
			</main>

			<div id="toast" class="toast hidden"></div>
		</div>

		<div id="qrModal" class="modal hidden" role="dialog" aria-modal="true">
			<div class="modal-backdrop" id="qrModalBackdrop"></div>
			<div class="modal-panel">
				<div class="modal-header">
					<h2 data-i18n="shareQr">分享二维码</h2>
					<button
						class="icon-btn"
						id="closeQr"
						data-i18n-title="close"
						title="关闭"
					>
						&times;
					</button>
				</div>
				<div class="qr-box">
					<canvas id="qrCanvas" width="300" height="300"></canvas>
				</div>
				<div class="qr-link" id="qrLink"></div>
			</div>
		</div>

		<script src="qrcode-lite.js"></script>
		<script src="app.js?v=20260801"></script>
	</body>
</html>
